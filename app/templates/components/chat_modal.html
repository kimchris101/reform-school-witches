<div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
    <div class="bg-archive-card border border-blood-900/60 w-full max-w-2xl p-6 rounded-sm shadow-[0_0_50px_rgba(163,15,46,0.25)] flex flex-col max-h-[85vh]">
        <!-- Modal Header -->
        <div class="flex items-center justify-between border-b border-blood-900/40 pb-4 mb-4">
            <h3 class="font-mono text-xs text-amber-400 uppercase tracking-[0.2em] font-bold">
                [ MANUSCRIPT ARCHIVE INDEX :: {{ character_name }} ]
            </h3>
            <button onclick="document.getElementById('modal-container').remove()" class="text-archive-muted hover:text-blood-500 font-mono text-xs uppercase transition-colors">
                ✕ CLOSE
            </button>
        </div>

        <!-- Excerpt Search Log Container -->
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 min-h-[250px]">
            <div class="bg-black/60 border border-blood-900/30 p-4 rounded-sm text-xs font-mono text-archive-muted leading-relaxed">
                [ MANUSCRIPT INDEX CONNECTED ]<br>
                Type a subject, character name, or phrase below to scan Book I: The Blood Lily Contract for verbatim excerpts.
            </div>
        </div>

        <!-- Input Query Form -->
        <form hx-post="/interactive/lore-search" 
              hx-target="#chat-messages" 
              hx-swap="beforeend" 
              hx-on::after-request="this.reset(); document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;"
              class="flex gap-2 border-t border-blood-900/40 pt-4">
            <input type="text" 
                   name="query" 
                   placeholder="Search manuscript index (e.g. Father Manuel, Salt Line)..." 
                   required 
                   class="flex-1 bg-black/80 border border-blood-900/60 text-parchment-100 px-4 py-2.5 font-mono text-xs focus:outline-none focus:border-blood-500">
            <button type="submit" 
                    class="bg-blood-900 hover:bg-blood-800 text-parchment-100 font-mono text-xs uppercase px-5 py-2.5 tracking-wider font-bold transition-colors">
                SEARCH
            </button>
        </form>
    </div>
</div>
