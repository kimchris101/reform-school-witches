<!-- Interactive Script Stage Fragment swapped by HTMX -->
<div id="script-stage" 
     class="relative w-full aspect-[16/9] min-h-[500px] bg-archive-bg border-4 border-blood-900/80 rounded-sm shadow-[0_0_50px_rgba(99,10,28,0.25)] overflow-hidden flex flex-col justify-end transition-all duration-500"
     style="background-image: linear-gradient(to top, rgba(7,10,15,0.95) 0%, rgba(7,10,15,0.4) 50%, rgba(7,10,15,0.7) 100%), url('{{ node.background_url }}'); background-size: cover; background-position: center;">

    <!-- Top Status Bar -->
    <div class="absolute top-0 inset-x-0 p-4 flex justify-between items-center border-b border-blood-900/60 bg-archive-bg/80 backdrop-blur-sm font-mono text-xs">
        <span class="text-blood-500 font-bold uppercase tracking-widest">NODE ID: {{ node.node_id }}</span>
        <span class="text-parchment-400">SACRAMENTAL REALISM ENGINE v1.0</span>
    </div>

    <!-- Speaker Portrait & Dialogue Overlay Area -->
    <div class="p-6 md:p-8 flex flex-col md:flex-row items-end gap-6 z-10">
        
        <!-- Character Portrait -->
        {% if node.portrait_url %}
        <div class="w-28 md:w-40 shrink-0 border-2 border-blood-800 rounded-sm overflow-hidden bg-archive-card shadow-2xl">
            <img src="{{ node.portrait_url }}" 
                 alt="{{ node.speaker }}" 
                 class="w-full h-auto object-cover grayscale contrast-125">
        </div>
        {% endif %}

        <!-- Dialogue Box -->
        <div class="flex-grow bg-archive-card/95 border border-archive-border p-5 md:p-6 rounded-sm shadow-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-archive-border pb-2">
                <h3 class="font-gothic text-lg text-parchment-100 uppercase tracking-wider font-bold">{{ node.speaker }}</h3>
                {% if node.speaker_title %}
                    <span class="font-mono text-[11px] text-blood-500 uppercase tracking-wider font-bold">{{ node.speaker_title }}</span>
                {% endif %}
            </div>
            <p class="font-serif text-sm md:text-base text-parchment-200 leading-relaxed italic">
                "{{ node.dialogue }}"
            </p>
        </div>
    </div>

    <!-- Branching Choices Panel -->
    <div class="p-6 pt-0 z-10 bg-archive-bg/90 backdrop-blur-md border-t border-archive-border">
        <p class="text-[10px] font-mono uppercase text-blood-500 font-bold tracking-widest mb-3">Select Response Vector:</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            {% for choice in node.choices %}
                <button hx-get="/interactive/node/{{ choice.next_node_id }}"
                        hx-target="#script-stage"
                        hx-swap="outerHTML transition:true"
                        class="p-3 bg-archive-card hover:bg-blood-950/80 border border-archive-border hover:border-blood-700 text-parchment-200 hover:text-parchment-100 font-serif text-xs text-left transition-all duration-200 rounded-sm flex flex-col justify-between group">
                    <span>{{ choice.text }}</span>
                    {% if choice.archetype_affinity %}
                        <span class="text-[9px] font-mono text-blood-500 uppercase mt-2 font-bold group-hover:text-blood-500">
                            + {{ choice.archetype_affinity }}
                        </span>
                    {% endif %}
                </button>
            {% endfor %}
        </div>
    </div>
</div>
