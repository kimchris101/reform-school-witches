<div class="space-y-4 font-serif text-base sm:text-lg animate-fade-in my-4">
    <!-- User Message Transmission -->
    <div class="flex flex-col items-end space-y-1">
        <span class="font-mono text-[11px] text-amber-400 uppercase tracking-widest font-bold">
            [ INITIATE TRANSMISSION ]
        </span>
        <div class="bg-black/80 border border-archive-border text-parchment-100 p-4 rounded-sm max-w-xl text-base leading-relaxed">
            {{ user_message }}
        </div>
    </div>

    <!-- AI Persona Transmission Response -->
    <div class="flex flex-col items-start space-y-1">
        <span class="font-mono text-[11px] text-blood-500 uppercase tracking-widest font-bold">
            [ {{ character_id|upper }} RESONANCE ]
        </span>
        <div class="bg-blood-950/40 border border-blood-900/80 text-parchment-100 p-5 rounded-sm max-w-2xl text-base sm:text-lg italic leading-relaxed shadow-lg">
            "{{ ai_response }}"
        </div>
    </div>
</div>
