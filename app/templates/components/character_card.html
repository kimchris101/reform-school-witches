<div class="bg-archive-card border border-archive-border hover:border-blood-700 rounded-sm shadow-xl flex flex-col justify-between overflow-hidden transition-all duration-300 group">
    <div>
        <!-- Fixed Portrait Box (Preserves Aspect Ratio & Centers Faces) -->
        <div class="w-full h-80 bg-archive-bg border-b border-archive-border relative overflow-hidden">
            <img src="{{ character.image_url }}" 
                 alt="{{ character.name }}" 
                 class="w-full h-full object-cover object-top grayscale contrast-125 group-hover:grayscale-0 group-hover:scale-105 transition-all duration-500" />
            
            <!-- Vignette Gradient Overlay -->
            <div class="absolute inset-0 bg-gradient-to-t from-archive-card via-transparent to-transparent opacity-80 pointer-events-none"></div>
            
            <!-- Classification Badge -->
            <span class="absolute top-3 left-3 bg-archive-bg/90 border border-blood-800 text-amber-400 font-mono text-[9px] uppercase px-2 py-0.5 rounded-sm font-bold z-10 shadow-md">
                {{ character.classification }}
            </span>
        </div>

        <!-- Character Details -->
        <div class="p-5 space-y-2">
            <p class="text-[10px] font-mono text-blood-500 font-bold uppercase tracking-widest">{{ character.title_role }}</p>
            <h3 class="text-xl font-gothic text-parchment-100 uppercase tracking-wider font-bold group-hover:text-amber-400 transition-colors">
                {{ character.name }}
            </h3>
            <p class="text-xs font-serif text-parchment-300 leading-relaxed line-clamp-3">
                {{ character.short_bio }}
            </p>
        </div>
    </div>

    <!-- Dossier Action Button -->
    <div class="p-5 pt-0">
        <button hx-get="/dossiers/{{ character.slug }}" 
                hx-target="#dossier-modal-container" 
                hx-swap="innerHTML"
                class="w-full bg-archive-bg hover:bg-blood-950/80 border border-archive-border hover:border-blood-700 text-parchment-200 hover:text-parchment-100 font-gothic py-2.5 px-3 rounded-sm transition-all flex justify-center items-center gap-2 font-bold uppercase tracking-wider text-xs">
            <span>☩</span> Inspect Personnel File
        </button>
    </div>
</div>
