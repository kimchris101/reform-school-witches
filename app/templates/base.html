<!DOCTYPE html>
<html lang="en" class="h-full bg-[#070a0f]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or "The Reform School for Witches Series | Official Portal" }}</title>
    <meta name="description" content="{{ meta_description or 'Official classified archive for The Reform School for Witches novel series (rsfwseries.com). Our Lady of Tears Academy.' }}">
    
    <!-- HTMX & Tailwind CSS -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Cinzel (Gothic Headlines) + EB Garamond (Classical Douay-Rheims Body Text) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', '"Noto Sans"', 'sans-serif'],
                        serif: ['"EB Garamond"', 'Georgia', 'serif'],
                        gothic: ['"Cinzel"', 'serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                    colors: {
                        blood: {
                            950: '#1a0307',
                            900: '#38050e',
                            800: '#630a1c',
                            700: '#800c24', // Core Crimson Blood Lily
                            600: '#a30f2e',
                            500: '#c7153a', // Vivid Highlight Red
                        },
                        parchment: {
                            100: '#f4f0e6', // Douay-Rheims Aged Page Text
                            200: '#e5dccb',
                            300: '#d1c2a5',
                            400: '#b8a37d',
                        },
                        archive: {
                            bg: '#070a0f',       // Deep Void Darkness
                            card: '#0f141d',     // Vault Registry Card
                            border: '#1e2636',   // Steel Vault Border
                            muted: '#717c8d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #070a0f;
            color: #e5dccb;
            background-image: radial-gradient(rgba(30, 38, 54, 0.4) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-serif antialiased selection:bg-blood-700 selection:text-parchment-100">

    <!-- Classified Top Header Bar -->
    <nav class="border-b border-archive-border bg-archive-card/95 backdrop-blur-md sticky top-0 z-40 px-4 md:px-8 py-3.5 flex justify-between items-center font-mono text-xs">
        <div class="flex items-center space-x-3">
            <a href="/" class="flex items-center space-x-2 group">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-blood-600 group-hover:bg-blood-500 transition-colors shadow-[0_0_8px_#a30f2e]"></span>
                <span class="font-bold text-parchment-100 tracking-wider uppercase group-hover:text-blood-500 transition-colors font-gothic">RSFW Series</span>
            </a>
            <span class="text-archive-muted">/</span>
            <span class="text-archive-muted hidden sm:inline uppercase tracking-widest text-[10px]">Classification: Sacramental Realism</span>
        </div>

        <!-- Registry Navigation -->
        <div class="flex items-center space-x-3 md:space-x-5">
            <a href="/intake" class="px-2.5 py-1 bg-archive-bg border border-archive-border hover:border-blood-700 rounded text-parchment-200 hover:text-blood-500 transition-all flex items-center gap-1.5">
                <span class="text-blood-600">✝</span> Diagnostic Protocol
            </a>
            <a href="/dossiers" class="px-2.5 py-1 bg-archive-bg border border-archive-border hover:border-blood-700 rounded text-parchment-200 hover:text-blood-500 transition-all flex items-center gap-1.5">
                <span class="text-blood-600">☩</span> Personnel Files
            </a>
            <a href="/interactive" class="px-2.5 py-1 bg-archive-bg border border-archive-border hover:border-blood-700 rounded text-parchment-200 hover:text-blood-500 transition-all flex items-center gap-1.5">
                <span class="text-blood-600">▶</span> Script Engine
            </a>
            <a href="/vault" class="px-2.5 py-1 bg-archive-bg border border-archive-border hover:border-blood-700 rounded text-parchment-200 hover:text-amber-400 transition-all flex items-center gap-1.5">
                <span class="text-blood-600">📜</span> Book Vault
            </a>
            <a href="/media" class="px-2.5 py-1 bg-archive-bg border border-archive-border hover:border-blood-700 rounded text-parchment-200 hover:text-amber-400 transition-all flex items-center gap-1.5">
                <span class="text-blood-600">🎬</span> Cinematics
            </a>
        </div>
    </nav>

    <!-- Main Viewport -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Douay-Rheims Style Gothic Footer -->
    <footer class="border-t border-archive-border bg-archive-card/90 py-8 px-4 text-center font-mono text-xs text-archive-muted">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <p class="font-serif italic text-parchment-300">
                Welcome to the Academy — <a href="https://rsfwseries.com" class="text-blood-500 hover:underline not-italic">rsfwseries.com</a>
            </p>
            <p class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-blood-700"></span>
                <span>ARCHDIOCESE OF NEW ORLEANS — CLASSIFIED PORTAL</span>
            </p>
        </div>
    </footer>

</body>
</html>
